<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멜론 주간 TOP10, 지난 12주 순위 추이</title>
<style>
  :root{
    color-scheme: dark;
    --surface:#1a1a19; --panel:#232322; --panel2:#2b2b29;
    --ink:#f4f2ec; --ink2:#a8a69d; --ink3:#7d7b74;
    --grid:#2b2a27; --grid2:#35332f;
    --gray:#8f8d85;          /* 그 외 7곡 */
    --pink:#fc6fcf;          /* 리센느 */
    --pinkdim:#8a3d74;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--surface);color:var(--ink);
    font-family:Pretendard,'Pretendard Variable',-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
    font-variant-numeric:tabular-nums; word-break:keep-all;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 0 8px}
  h1{display:none}
  h1{font-size:31px;line-height:1.25;font-weight:800;margin:0 0 10px;letter-spacing:-.02em}
  .sub{font-size:17px;line-height:1.5;color:var(--ink);margin:0 0 6px;font-weight:600}
  .sub b{color:var(--pink);font-weight:800}
  .lead{font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0 0 22px;max-width:860px}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--panel);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
  button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--grid2);
    border-radius:9px;padding:8px 15px;cursor:pointer;font-weight:600;font-size:14px}
  button:hover{border-color:var(--ink3)}
  button.play{background:var(--pink);color:#191313;border-color:var(--pink);min-width:92px}
  button.play:hover{filter:brightness(1.08)}
  button[aria-pressed="true"]{border-color:var(--pink);color:var(--pink)}
  .wk{font-size:14px;color:var(--ink2);min-width:210px}
  .wk b{color:var(--ink);font-weight:700;font-size:15px}
  input[type=range]{flex:1;min-width:200px;accent-color:var(--pink);height:22px}
  .card{background:var(--panel);border-radius:var(--r);padding:8px 10px 4px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .legend{display:flex;gap:22px;flex-wrap:wrap;align-items:center;
    padding:14px 18px 2px;font-size:13.5px;color:var(--ink2)}
  .legend i{display:inline-block;width:22px;height:3px;border-radius:2px;vertical-align:3px;margin-right:8px}
  .legend .dash{background:none;border-top:3px dotted var(--ink3);height:0}
  figcaption{font-size:12.5px;color:var(--ink3);line-height:1.6;margin:16px 2px 0}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
  th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--ink2);font-weight:600;font-size:12px;border-bottom-color:var(--grid2)}
  tbody tr.rs td{color:var(--pink)}
  td.out{color:var(--ink3)}
  .tablewrap{overflow-x:auto;background:var(--panel);border-radius:var(--r);padding:6px 16px 14px;margin-top:14px}
  [hidden]{display:none!important}
  .tip{position:fixed;pointer-events:none;z-index:9;background:#0e0e0d;border:1px solid var(--grid2);
    border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.55;min-width:210px;
    box-shadow:0 10px 28px rgba(0,0,0,.55);opacity:0;transition:opacity .12s}
  .tip h4{margin:0 0 7px;font-size:12px;color:var(--ink2);font-weight:600}
  .tip div{display:flex;justify-content:space-between;gap:16px}
  .tip .n{color:var(--ink3);width:26px;text-align:right}
  .tip .s{flex:1;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
  .tip .rs .s{color:var(--pink);font-weight:700}
  @media (max-width:720px){ h1{font-size:24px} .wrap{padding:22px 14px 40px} .wk{min-width:100%} }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl"></h1>
  <p class="sub" id="sub"></p>
  <p class="lead" id="lead"></p>

  <div class="bar">
    <button class="play" id="play">▶ 재생</button>
    <span class="wk" id="wklabel"></span>
    <input type="range" id="scrub" min="0" max="1100" value="1100" step="1" aria-label="주차 이동">
    <button id="tbtn" aria-pressed="false">표로 보기</button>
  </div>

  <figure class="card" style="margin:0">
    <svg id="chart" viewBox="0 0 1200 650" role="img" aria-labelledby="ttl"></svg>
    <div class="legend">
      <span><i style="background:var(--pink)"></i>리센느 (RESCENE)</span>
      <span><i style="background:var(--gray)"></i>그 외 7곡</span>
      <span><i class="dash"></i>차트 밖에서 진입한 구간</span>
      <span style="color:var(--ink3)">가로축은 주 시작일(월요일)</span>
    </div>
  </figure>

  <div class="tablewrap" id="tablewrap" hidden></div>
  <figcaption id="foot"></figcaption>
</div>
<div class="tip" id="tip"></div>

const gStatic=el('g'),gLine=el('g'),gHead=el('g'),gLab=el('g'),gHit=el('g');
svg.append(gStatic,gLine,gHead,gLab,gHit);

/* 축 압축 띠 — 눈금이 끊기는 자리를 눈에 보이게 둔다 */
gStatic.append(el('rect',{x:L,y:BRK1,width:R-L,height:BRK2-BRK1,fill:'#1b1a18'}));
{const t=el('text',{x:L-14,y:(BRK1+BRK2)/2+4,fill:'var(--ink3)','font-size':10.5,'text-anchor':'end'});
 t.textContent='축 압축'; gStatic.append(t);}

const 눈금=[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[20,0],[50,0],[100,0]];
눈금.forEach(([r,강])=>{
  gStatic.append(el('line',{x1:L,x2:R,y1:y(r),y2:y(r),stroke:'var(--grid)','stroke-width':1,
                            opacity:강?1:.75}));
  const t=el('text',{x:L-14,y:y(r)+5,fill:'var(--ink3)','font-size':강?13:11.5,'text-anchor':'end'});
  t.textContent=r+'위'; gStatic.append(t);
});
gStatic.append(el('line',{x1:L,x2:R,y1:OUT,y2:OUT,stroke:'var(--grid)','stroke-width':1}));
{const t=el('text',{x:L-14,y:OUT+5,fill:'var(--ink3)','font-size':11.5,'text-anchor':'end'});
 t.textContent='100위 밖'; gStatic.append(t);}

주.forEach((w,i)=>{
  gStatic.append(el('line',{x1:x(i),x2:x(i),y1:T-10,y2:OUT+8,stroke:'var(--grid)','stroke-width':1,opacity:.5}));
  const [,m,d]=w.시작.split('-');
  const t=el('text',{x:x(i),y:OUT+32,fill:'var(--ink3)','font-size':12,'text-anchor':'middle'});
  t.textContent=(+m)+'/'+(+d); gStatic.append(t);
});

/* ---------- 곡별 기하 ---------- */
곡.forEach(c=>{
  c.pts = c.순위.map((r,i)=> r==null ? null : [x(i), y(r)]);
  c.first = c.순위.findIndex(r=>r!=null);           // 차트 진입 주
  c.color = c.리센느 ? 'var(--pink)' : 'var(--gray)';
  c.w     = c.리센느 ? 3.4 : 2;
  c.path  = el('path',{fill:'none',stroke:c.color,'stroke-width':c.w,
                       'stroke-linecap':'round','stroke-linejoin':'round',
                       opacity:c.리센느?1:.82});
  c.entry = el('line',{stroke:c.color,'stroke-width':c.리센느?2.6:1.6,
                       'stroke-dasharray':'2 6','stroke-linecap':'round',opacity:.42});
  gLine.append(c.entry,c.path);

  if(c.리센느){                              /* 앨범 표지가 라인의 머리를 타고 간다 */
    c.head = el('g');
    c.head.append(el('rect',{x:-22,y:-22,width:44,height:44,rx:11,fill:'var(--pink)'}));
    const im=el('image',{x:-19,y:-19,width:38,height:38,href:c.cover,
                         preserveAspectRatio:'xMidYMid slice'});
    im.setAttribute('clip-path','inset(0 round 8px)');
    c.head.append(im);
  }else{
    c.head = el('circle',{r:4.6,fill:c.color,stroke:'var(--surface)','stroke-width':2});
  }
  gHead.append(c.head);

  /* 차트 밖이었던 주 — 아래 레인에 옅은 점으로 남긴다 */
  c.outDots = el('g');
  for(let i=0;i<c.first;i++)
    c.outDots.append(el('circle',{cx:x(i),cy:OUT,r:3,fill:c.color,opacity:.32}));
  gLine.append(c.outDots);

  /* 오른쪽 끝 직접 라벨 (순위 · 곡 · 아티스트) */
  c.lab = el('g');
  const rk=el('text',{x:R+56,y:5,fill:c.color,'font-size':17,'font-weight':800,'text-anchor':'end'});
  const nm=el('text',{x:R+68,y:-2,fill:c.리센느?'var(--pink)':'var(--ink)','font-size':14.5,
                      'font-weight':c.리센느?800:600});
  const ar=el('text',{x:R+68,y:15,fill:'var(--ink3)','font-size':11.5});
  nm.textContent=c.곡; ar.textContent=c.아티스트;
  c.lab.append(rk,nm,ar); c.labRank=rk;
  gLab.append(c.lab);
});

/* ---------- 프레임 그리기 ---------- */
const 보간=(a,b,t)=>a+(b-a)*t;
function 위치(c,p){                       // p = 실수 주차 인덱스
  const i=Math.min(Math.floor(p),N-1), f=p-i;
  const a=c.pts[i], b=c.pts[i+1];
  if(a&&b) return [보간(a[0],b[0],f),보간(a[1],b[1],f)];
  if(a) return a;
  if(b&&f>0) return [x(p), OUT];          // 진입 직전: 밖 레인에서 대기
  return null;
}
function draw(p){
  const done=Math.floor(p+1e-9);
  곡.forEach(c=>{
    const seg=[];
    for(let i=c.first;i>=0&&i<=Math.min(done,N-1);i++) if(c.pts[i]) seg.push(c.pts[i]);
    const cur = p>=c.first ? 위치(c,p) : null;
    if(cur && (seg.length===0 || cur[0]>seg[seg.length-1][0]+.01)) seg.push(cur);
    c.path.setAttribute('d', seg.length>1 ? 'M'+seg.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L') : '');

    const 보임 = cur!=null;
    c.head.style.display = 보임?'':'none';
    c.lab.style.display  = 보임?'':'none';
    c.cy = 보임 ? cur[1] : null;
    /* 「그 주 차트 밖이었다」는 점은 지나온 주까지만 켠다 */
    [...c.outDots.children].forEach((d,i)=> d.setAttribute('opacity', i<=p?.32:0));
    if(!보임){ c.entry.setAttribute('opacity',0); return; }

    if(c.리센느) c.head.setAttribute('transform','translate('+cur[0].toFixed(1)+','+cur[1].toFixed(1)+')');
    else { c.head.setAttribute('cx',cur[0].toFixed(1)); c.head.setAttribute('cy',cur[1].toFixed(1)); }

    /* 차트 밖 → 첫 등장 점을 잇는 점선 */
    if(c.first>0 && p>=c.first){
      c.entry.setAttribute('x1',x(c.first-1)); c.entry.setAttribute('y1',OUT);
      c.entry.setAttribute('x2',c.pts[c.first][0]); c.entry.setAttribute('y2',c.pts[c.first][1]);
      c.entry.setAttribute('opacity',.42);
    } else c.entry.setAttribute('opacity',0);
  });

  /* 라벨은 현재 순위 순으로 쌓되 서로 38px 이상 떨어뜨린다 */
  const 보이는=곡.filter(c=>c.cy!=null).sort((a,b)=>a.cy-b.cy);
  const wi0=Math.min(Math.round(p),N-1);
  let prev=-1e9;
  보이는.forEach(c=>{
    const ly=Math.max(c.cy, prev+38); prev=ly;
    c.lab.setAttribute('transform','translate(0,'+ly.toFixed(1)+')');
    const r=c.순위[wi0]; c.labRank.textContent = r!=null ? r : '';
  });

  const wi=Math.min(Math.round(p),N-1), w=주[wi];
  document.getElementById('wklabel').innerHTML =
    '<b>'+w.시작.slice(5).replace('-','/')+' ~ '+w.끝.slice(5).replace('-','/')+'</b> 주간 &nbsp;·&nbsp; '+(wi+1)+' / '+N;
}

/* ---------- 재생 ---------- */
const scrub=document.getElementById('scrub'), playBtn=document.getElementById('play');
scrub.max=(N-1)*100;
let p=N-1, playing=false, last=0;
const 속도=1.15;                                   // 초당 주차
function set(v){ p=Math.max(0,Math.min(N-1,v)); scrub.value=Math.round(p*100); draw(p); }
function tick(ts){
  if(!playing) return;
  if(last){ p+=(ts-last)/1000*속도; }
  last=ts;
  if(p>=N-1){ set(N-1); stop(); return; }
  set(p); requestAnimationFrame(tick);
}
function play(){ if(p>=N-1) p=0; playing=true; last=0; playBtn.textContent='❚❚ 정지';
  requestAnimationFrame(tick); }
function stop(){ playing=false; playBtn.textContent='▶ 재생'; }
playBtn.onclick=()=> playing?stop():play();
scrub.oninput=()=>{ stop(); set(+scrub.value/100); };

/* ---------- 크로스헤어 · 툴팁 ---------- */
const tip=document.getElementById('tip');
const hit=el('rect',{x:L,y:T-14,width:R-L,height:OUT-T+28,fill:'transparent'});
const cross=el('line',{y1:T-14,y2:OUT+8,stroke:'var(--ink3)','stroke-width':1,opacity:0});
gHit.append(cross,hit);
hit.addEventListener('pointermove',e=>{
  const bb=svg.getBoundingClientRect(), sx=(e.clientX-bb.left)/bb.width*W;
  const i=Math.max(0,Math.min(N-1,Math.round((sx-L)/((R-L)/(N-1)))));
  cross.setAttribute('x1',x(i)); cross.setAttribute('x2',x(i)); cross.setAttribute('opacity',.6);
  const w=주[i];
  const 행=곡.map(c=>({c,r:c.순위[i]})).sort((a,b)=>(a.r??999)-(b.r??999));
  tip.innerHTML='<h4>'+w.시작+' ~ '+w.끝+'</h4>'+행.map(o=>
    '<div class="'+(o.c.리센느?'rs':'')+'"><span class="n">'+(o.r??'–')+'</span>'+
    '<span class="s">'+o.c.곡+'</span></div>').join('');
  tip.style.opacity=1;
  const tw=tip.offsetWidth||230;
  tip.style.left=Math.min(window.innerWidth-tw-12,e.clientX+18)+'px';
  tip.style.top =Math.min(window.innerHeight-tip.offsetHeight-12,e.clientY-30)+'px';
});
hit.addEventListener('pointerleave',()=>{tip.style.opacity=0;cross.setAttribute('opacity',0);});

/* ---------- 표 ---------- */
const tw=document.getElementById('tablewrap'), tbtn=document.getElementById('tbtn');
tw.innerHTML='<table><thead><tr><th>곡 · 아티스트</th>'+
  주.map(w=>'<th>'+w.시작.slice(5).replace('-','/')+'</th>').join('')+'</tr></thead><tbody>'+
  곡.map(c=>'<tr class="'+(c.리센느?'rs':'')+'"><td>'+c.곡+' <span style="color:var(--ink3)">· '+c.아티스트+'</span></td>'+
    c.순위.map(r=>r==null?'<td class="out">밖</td>':'<td>'+r+'</td>').join('')+'</tr>').join('')+
  '</tbody></table><p style="font-size:12px;color:var(--ink3);margin:10px 2px 0">「밖」 = 그 주 100위 밖. 멜론 주간차트는 100위까지만 공개된다.</p>';
tbtn.onclick=()=>{const on=tw.hidden; tw.hidden=!on; tbtn.setAttribute('aria-pressed',String(on));
  tbtn.textContent = on?'표 접기':'표로 보기';};

draw(N-1);
</script>
<script>
/* 부모(rescene-now)에게 제 높이를 알려 준다 — 창 폭에 따라 내용 높이가 달라진다 */
function _h(){ try{ parent.postMessage(
  {멜론차트높이: Math.ceil(document.body.getBoundingClientRect().height)}, "*"); }catch(e){} }
new ResizeObserver(_h).observe(document.body); addEventListener("load", _h); _h();
</script>
</body>
